<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="jdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="jdOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="jdTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
    <filter id="templeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="31" fill="#0A1628"/>
  <circle cx="32" cy="32" r="30" stroke="url(#jdGold)" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="28" stroke="#132240" stroke-width="0.8"/>

  <!-- Janaki Dham Radiant Halo / Aura -->
  <circle cx="32" cy="28" r="21" fill="url(#haloGlow)"/>
  <circle cx="32" cy="28" r="18" stroke="url(#jdGold)" stroke-width="1.5" stroke-dasharray="2 3" stroke-opacity="0.75"/>

  <!-- Soundwaves behind Janaki Mandir -->
  <path d="M 6 34 C 9 29, 11 39, 14 34" stroke="url(#jdTeal)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 50 34 C 53 29, 55 39, 58 34" stroke="url(#jdTeal)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ===== JANAKI MANDIR PALACE ARCHITECTURE ===== -->

  <!-- Base Temple Foundation -->
  <rect x="14" y="44" width="36" height="7" rx="1" fill="url(#jdGold)"/>
  <rect x="12" y="50" width="40" height="3" rx="1.5" fill="#D97706"/>

  <!-- Lower Colonnade / Arches -->
  <rect x="16" y="34" width="32" height="11" fill="#132240" stroke="url(#jdGold)" stroke-width="1.2"/>

  <!-- Grand Central Gateway / Arched Doorway (Garbhagriha Entrance) -->
  <path d="M 28 45 L 28 38 C 28 35.5, 36 35.5, 36 38 L 36 45 Z" fill="#0A1628" stroke="url(#jdGold)" stroke-width="1.4"/>
  <circle cx="32" cy="36.5" r="1.2" fill="#2DD4BF"/>

  <!-- Left / Right Arched Windows -->
  <path d="M 19 43 L 19 39 C 19 37.5, 23 37.5, 23 39 L 23 43 Z" fill="url(#jdOrange)"/>
  <path d="M 41 43 L 41 39 C 41 37.5, 45 37.5, 45 39 L 45 43 Z" fill="url(#jdOrange)"/>

  <!-- Upper Tier / Balcony (Jharokha) -->
  <rect x="22" y="27" width="20" height="8" fill="#132240" stroke="url(#jdGold)" stroke-width="1.2"/>
  <circle cx="26" cy="31" r="1.3" fill="url(#jdGold)"/>
  <circle cx="32" cy="31" r="1.3" fill="url(#jdGold)"/>
  <circle cx="38" cy="31" r="1.3" fill="url(#jdGold)"/>

  <!-- Side Spire 1 (Far Left Chhatri) -->
  <rect x="14" y="27" width="5" height="8" fill="url(#jdGold)"/>
  <path d="M 13.5 27 C 13.5 22, 19.5 22, 19.5 27 Z" fill="url(#jdOrange)"/>
  <path d="M 16.5 22 L 16.5 19.5" stroke="url(#jdGold)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16.5" cy="19.5" r="0.8" fill="#FCD34D"/>

  <!-- Side Spire 2 (Far Right Chhatri) -->
  <rect x="45" y="27" width="5" height="8" fill="url(#jdGold)"/>
  <path d="M 44.5 27 C 44.5 22, 50.5 22, 50.5 27 Z" fill="url(#jdOrange)"/>
  <path d="M 47.5 22 L 47.5 19.5" stroke="url(#jdGold)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="47.5" cy="19.5" r="0.8" fill="#FCD34D"/>

  <!-- Mid Spire Left -->
  <path d="M 21.5 27 C 21.5 20, 26.5 20, 26.5 27 Z" fill="url(#jdGold)"/>
  <path d="M 24 20 L 24 18" stroke="url(#jdGold)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Mid Spire Right -->
  <path d="M 37.5 27 C 37.5 20, 42.5 20, 42.5 27 Z" fill="url(#jdGold)"/>
  <path d="M 40 20 L 40 18" stroke="url(#jdGold)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ===== GRAND CENTRAL DOME (SHIKHARA) ===== -->
  <!-- Fluted Grand Dome -->
  <path d="M 24 27 C 24 16, 40 16, 40 27 Z" fill="url(#jdOrange)" stroke="url(#jdGold)" stroke-width="1.4" filter="url(#templeGlow)"/>
  
  <!-- Dome Ribs -->
  <path d="M 32 16 L 32 27" stroke="url(#jdGold)" stroke-width="1.2"/>
  <path d="M 28 17.5 C 29 20.5, 29 24.5, 28 27" stroke="#FEF08A" stroke-width="1"/>
  <path d="M 36 17.5 C 35 20.5, 35 24.5, 36 27" stroke="#FEF08A" stroke-width="1"/>

  <!-- Sacred Kalash Finial / Spire Top -->
  <path d="M 32 16 L 32 11" stroke="url(#jdGold)" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="32" cy="11.5" r="1.8" fill="#FEF08A"/>
  <path d="M 32 10 L 32 8" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="32,7 30.5,9.5 33.5,9.5" fill="#DC2626"/>

  <!-- Sacred Mithila Dot / Shubh Bindi -->
  <circle cx="32" cy="22" r="1.3" fill="#FEF08A"/>
</svg>